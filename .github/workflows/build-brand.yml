name: Build Custom Brand VPN Client

on:
  workflow_dispatch:
    inputs:
      brand_name:
        description: 'Brand Name (e.g. StarVPN, MoonNet) - Alphanumeric only'
        required: true
        default: 'StarVPN'
      portal_url:
        description: 'Portal API URL (e.g. https://panel.starvpn.com)'
        required: false
        default: 'https://panel.netfast.vip/'
      panel_url:
        description: 'Web Panel Login URL (optional)'
        required: false
        default: ''
      telegram_url:
        description: 'Telegram Channel URL (e.g. https://t.me/starvpn)'
        required: false
        default: 'https://t.me/netfastvip'
      support_url:
        description: 'Telegram Support URL (e.g. https://t.me/starvpn_support)'
        required: false
        default: 'https://t.me/nfv_sup'
      icon_url:
        description: 'Direct URL to custom .ico file (optional)'
        required: false
        default: ''
      base_ovpn_url:
        description: 'Direct URL to custom base.ovpn (optional)'
        required: false
        default: ''
      ca_cert_url:
        description: 'Direct URL to custom ca.crt (optional)'
        required: false
        default: ''
      version:
        description: 'Application Version'
        required: false
        default: '3.0.2'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ inputs.brand_name }} (v${{ inputs.version }})
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get Current Date
        id: build_date
        shell: bash
        run: echo "date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

      - name: Build and Package Branded VPN Client
        shell: powershell
        run: |
          .\build-brand.ps1 `
            -BrandName "${{ inputs.brand_name }}" `
            -PortalUrl "${{ inputs.portal_url }}" `
            -PanelUrl "${{ inputs.panel_url }}" `
            -TelegramUrl "${{ inputs.telegram_url }}" `
            -SupportUrl "${{ inputs.support_url }}" `
            -IconPath "${{ inputs.icon_url }}" `
            -BaseOvpnPath "${{ inputs.base_ovpn_url }}" `
            -CaCertPath "${{ inputs.ca_cert_url }}" `
            -Version "${{ inputs.version }}" `
            -OutputDir "dist"

      - name: Upload Branded Release ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.brand_name }}-Windows-v${{ inputs.version }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}-${{ inputs.brand_name }}
          name: '${{ inputs.brand_name }} Windows Client v${{ inputs.version }}'
          body: |
            ## 🚀 ${{ inputs.brand_name }} Windows Client (v${{ inputs.version }})
            
            Portable standalone package generated by White-Label Cloud Builder.
            
            - **Brand:** ${{ inputs.brand_name }}
            - **Version:** ${{ inputs.version }}
            - **Portal URL:** ${{ inputs.portal_url }}
            - **Build Date:** ${{ steps.build_date.outputs.date }}
            
            ### 📥 Download & Run:
            1. Download the `.zip` archive below.
            2. Extract all files to a folder.
            3. Double click `${{ inputs.brand_name }}.vbs` to launch.
          files: dist/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
